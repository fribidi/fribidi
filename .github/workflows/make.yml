name: Build with make

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        compiler: [gcc]

    steps:
    - uses: actions/checkout@v7
    - name: build c2man
      run: bash .ci/build-c2man.sh
    - run: echo "$GITHUB_WORKSPACE/c2man/c2man-install" >> $GITHUB_PATH
    - run: which c2man
    - name: Install help2man
      run: |
        sudo apt-get update
        sudo apt-get install -y help2man
    - name: configure
      run: ./autogen.sh
    - run: make
    - run: make check
    - run: make distcheck

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v7
      with:
        path: fribidi-*.tar.xz

    - name: Upload test-suite.log
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-suite-log
        path: |
          test/test-suite.log
          fribidi-*/_build/sub/test/test-suite.log
        if-no-files-found: ignore

  cross-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: build c2man
      run: bash .ci/build-c2man.sh
    - run: echo "$GITHUB_WORKSPACE/c2man/c2man-install" >> $GITHUB_PATH
    - name: Install ARM64 cross-compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
    - uses: actions/download-artifact@v7
      with:
        name: artifact
    - name: Extract release tarball
      run: |
        mkdir cross-build
        tar -xf fribidi-*.tar.xz --strip-components=1 -C cross-build
    - name: Configure in-source ARM64 cross-build
      working-directory: cross-build
      run: |
        ./configure --build="$(gcc -dumpmachine)" --host=aarch64-linux-gnu \
          --prefix="$RUNNER_TEMP/fribidi-arm64" CC_FOR_BUILD=gcc
    - run: make
      working-directory: cross-build
    - run: make install
      working-directory: cross-build
